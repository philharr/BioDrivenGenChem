"https://www.biorxiv.org/content/10.1101/2025.02.19.638723v1", "2025", "SELFIES", "GEP", "No", "No", "VAE", "Contrastive learning", "", "", "No"], ["Transcriptomics", "PhenoMoler", "Song & Liu", "https://arxiv.org/abs/2509.21424", "2025", "SELFIES", "GEP", "No", "No", "Transformer", "CNN", "", "", "No"], ["Transcriptomics", "GPS platform", "Xing et al.", "https://www.cell.com/cell/fulltext/S0092-8674(26)00223-0", "2026", "Graph", "GEP", "No", "No", "Transformer", "", "MCTS", "GEP, QED, SA, solubility", "Yes"], ["Cell morphology", "[CPGAN]", "Zapata et al.", "https://pubs.rsc.org/en/content/articlelanding/2023/dd/d2dd00081d", "2022", "SELFIES", "CellProfiler features", "No", "No", "GAN", "VAE", "", "", "No"], ["Cell morphology", "GFlowNet", "Lu et al.", "https://arxiv.org/abs/2408.05196v1", "2024", "Graph", "CellProfiler features", "No", "No", "Flow", "Contrastive learning", "", "", "No"], ["Cell morphology", "[CPGAN] exp. val.", "Fabjan et al.", "https://www.biorxiv.org/content/10.1101/2025.09.13.676062v1", "2025", "SELFIES", "CellProfiler features", "No", "No", "GAN", "VAE", "", "", "Yes"], ["Cell morphology", "MGMG", "Tang et al.", "https://www.biorxiv.org/content/10.1101/2025.07.11.664424v1", "2025", "SELFIES", "CellProfiler features", "No", "No", "Transformer", "Contrastive learning", "", "", "No"], ["Cell morphology", "Pert2Mol", "Wang et al.", "https://www.biorxiv.org/content/10.64898/2026.02.02.703193v1", "2026", "SMILES", "GEP + cell images", "No", "No", "Flow", "BERT, ResNet", "", "", "No"]], "filterCols": [0, 4, 5, 6, 7, 8, 9, 11, 13]}</script>
  <script>
    const csvPath = '../data/BioDrivenGenChem_Table1.csv';
    const filterColumnNames = [
      'Biological data',
      'Year',
      'Molecule input',
      'Biological input',
      '3D',
      'SE(3)-eq.',
      'Main architecture',
      'Optimisation',
      'Experimental validation'
    ];

    let headers = [];
    let allRows = [];
    let filterCols = [];

    const table = document.getElementById('dataTable');
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');
    const search = document.getElementById('globalSearch');
    const filtersBox = document.getElementById('filters');
    const count = document.getElementById('count');
    const empty = document.getElementById('empty');
    const filters = new Map();
    let sortState = { col: null, asc: true };

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(field);
          field = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(field);
          if (row.some(cell => cell.trim() !== '')) rows.push(row);
          row = [];
          field = '';
        } else {
          field += char;
        }
      }

      if (field.length || row.length) {
        row.push(field);
        if (row.some(cell => cell.trim() !== '')) rows.push(row);
      }

      return rows;
    }

    async function loadTableData() {
      try {
        const response = await fetch(csvPath, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not load CSV: ${response.status}`);
        const csv = await response.text();
        const parsed = parseCSV(csv);
        headers = parsed[0].map(h => h.trim());
        allRows = parsed.slice(1).map(row =>
          headers.map((_, index) => row[index] ?? '')
        );
        filterCols = filterColumnNames
          .map(name => headers.indexOf(name))
          .filter(index => index >= 0);
      } catch (error) {
        console.warn('Using embedded fallback data. On GitHub Pages, the page will load the CSV from /data/.', error);
        const fallback = JSON.parse(document.getElementById('table-data').textContent);
        headers = fallback.headers;
        allRows = fallback.rows;
        filterCols = fallback.filterCols;
      }
    }

    function normalize(value) {
      return String(value ?? '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').trim();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function isUrl(value) {
      return /^https?:\/\//i.test(String(value ?? '').trim());
    }

    function splitFilterValues(value) {
      return String(value ?? '')
        .split(/\s*(?:;|,)\s*/)
        .map(v => v.trim())
        .filter(Boolean);
    }

    function cellHtml(value, col) {
      const text = String(value ?? '').trim();
      if (!text) return '<span class="empty-cell">—</span>';
      if (headers[col] === 'Paper' && isUrl(text)) {
        return `<a href="${escapeHtml(text)}" target="_blank" rel="noopener noreferrer">paper link</a>`;
      }
      return escapeHtml(text);
    }

    function buildHeader() {
      thead.innerHTML = '';
      const tr = document.createElement('tr');
      headers.forEach((header, col) => {
        const th = document.createElement('th');
        th.textContent = header;
        th.className = 'sortable';
        th.dataset.column = col;
        th.title = 'Click to sort';
        th.addEventListener('click', () => {
          sortState.asc = sortState.col === col ? !sortState.asc : true;
          sortState.col = col;
          applyFilters();
        });
        tr.appendChild(th);
      });
      thead.appendChild(tr);
    }

    function buildFilters() {
      filtersBox.innerHTML = '';
      filterCols.forEach(col => {
        const wrapper = document.createElement('div');
        const label = document.createElement('label');
        label.textContent = headers[col];
        label.htmlFor = `filter-${col}`;
        const select = document.createElement('select');
        select.id = `filter-${col}`;
        select.innerHTML = '<option value="">All</option>';

        const values = [...new Set(allRows.flatMap(row => splitFilterValues(row[col])))]
          .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
        values.forEach(value => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });
        select.addEventListener('change', () => {
          if (select.value) filters.set(col, select.value);
          else filters.delete(col);
          applyFilters();
        });
        wrapper.appendChild(label);
        wrapper.appendChild(select);
        filtersBox.appendChild(wrapper);
      });
    }

    function rowMatches(row) {
      const q = normalize(search.value);
      if (q) {
        const terms = q.split(/\s+/).filter(Boolean);
        const haystack = normalize(row.join(' '));
        if (!terms.every(term => haystack.includes(term))) return false;
      }
      for (const [col, value] of filters.entries()) {
        const rowValues = splitFilterValues(row[col]).map(normalize);
        if (!rowValues.includes(normalize(value))) return false;
      }
      return true;
    }

    function sortRows(rows) {
      if (sortState.col === null) return rows;
      const col = sortState.col;
      return rows.slice().sort((a, b) => {
        const av = String(a[col] ?? '').trim();
        const bv = String(b[col] ?? '').trim();
        const an = Number(av);
        const bn = Number(bv);
        const cmp = av !== '' && bv !== '' && !Number.isNaN(an) && !Number.isNaN(bn)
          ? an - bn
          : av.localeCompare(bv, undefined, { numeric: true, sensitivity: 'base' });
        return sortState.asc ? cmp : -cmp;
      });
    }

    function renderRows(rows) {
      tbody.innerHTML = rows.map(row =>
        '<tr>' + headers.map((_, col) => `<td>${cellHtml(row[col], col)}</td>`).join('') + '</tr>'
      ).join('');
      empty.hidden = rows.length !== 0;
      table.hidden = rows.length === 0;
    }

    function updateSortIndicators() {
      thead.querySelectorAll('th').forEach(th => th.classList.remove('sorted-asc', 'sorted-desc'));
      if (sortState.col !== null) {
        const th = thead.querySelectorAll('th')[sortState.col];
        if (th) th.classList.add(sortState.asc ? 'sorted-asc' : 'sorted-desc');
      }
    }

    function applyFilters() {
      const rows = sortRows(allRows.filter(rowMatches));
      renderRows(rows);
      updateSortIndicators();
      count.textContent = `${rows.length} of ${allRows.length} rows shown`;
    }

    async function init() {
      await loadTableData();
      buildHeader();
      buildFilters();
      applyFilters();

      search.addEventListener('input', applyFilters);
      document.getElementById('resetBtn').addEventListener('click', () => {
        search.value = '';
        filters.clear();
        filtersBox.querySelectorAll('select').forEach(select => select.value = '');
        sortState = { col: null, asc: true };
        applyFilters();
        search.focus();
      });
    }

    init();
  </script>
